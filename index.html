<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landingpage CATERING 2026</title>
    <!-- css -->
    <link rel="stylesheet" href="style.css" />
    <!-- remixicons -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- navbar start-->
    <nav>
      <!-- logo -->
      <div class="logo">
        <img src="asset/logonr.png" alt="" />
      </div>
      <!-- menu -->
      <div class="menus">
        <div class="menu">
          <i class="ri-restaurant-2-fill"></i>
          <span>Menu</span>
        </div>
        <div class="menu">
          <i class="ri-book-open-fill"></i>
          <span>Paket Acara</span>
        </div>
        <div class="menu">
          <i class="ri-flask-fill"></i>
          <span>Testimoni</span>
        </div>
        <div class="menu">
          <i class="ri-file-info-fill"></i>
          <span>Tentang Kami</span>
        </div>
      </div>
      <!-- tombol -->
      <div class="tombol">
        <div class="tbl1">
          <span>Pesan Sekarang</span>
        </div>
        <!-- tombol hamburger menu -->
        <div class="tbl2" id="hamburger">
          <i class="ri-menu-fill"></i>
        </div>
      </div>
    </nav>
    <!-- navbar end -->
  </body>
</html>
